# dsh-exp-office bundle patch: mount the Office/WPS document toolkit into the
# host plane so every agent preset can see its tools.
#
# Applied over the dsh-base layer; later layers (the profile's own
# cordis.patch.yml and --patch overlays) can still address this row by id.
- insert:
    - id: dsh-exp-office
      name: 'dsh-exp-office'
